<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank you</title>
<link rel="stylesheet" href="style/eweb.css">
<link rel="stylesheet" href="style/az.css">
<style>
  h1{font-size:112px;line-height:.92;letter-spacing:-4.6px;margin-top:110px}
  .sub{font-size:20px;max-width:470px;margin-top:26px}
  .next{margin-top:30px;width:480px;border-top:1px solid var(--ink);padding-top:12px}
  .next .tag{color:var(--blue)}
  .next p{font-size:15px;line-height:1.5;color:var(--char);margin-top:6px}
  .cta{margin-top:24px;display:flex;gap:12px}
  #hero{left:600px;top:0;width:680px;height:720px}
</style>
</head>
<body data-foot="Elastic Security · AlertZero">
<div class="z">
  <div class="eyebrow in1">Leveraging AlertZero</div>
  <h1 class="in2">Thank<br><span class="b">you.</span></h1>
  <p class="sub in3">Questions? Let's keep the conversation going.</p>
  <div class="next in4"><div class="tag">A good first step</div><p>Turn on one Watch in manual. Read the receipts for a week. Move the dial when they have earned it.</p></div>
  <div class="cta in5"><a class="btn" href="https://www.elastic.co/security" target="_blank" rel="noopener" style="text-decoration:none;pointer-events:auto;cursor:pointer;position:relative;z-index:6">elastic.co/security&nbsp;&nbsp;↗</a></div>
</div>
<svg id="hero" class="iso" viewBox="0 0 680 720"></svg>
<script src="style/eweb.js"></script>
<script src="style/az.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  EW.dots({x: 640, y: 30, w: 640, h: 660, seed: 4, blobs: 6, thr: .5});
  const sc = AZ.iso(document.getElementById('hero'), {ox: 300, oy: 300, s: .8});
  sc.rect({x: -30, y: -30, w: 330, d: 330, z: 0, delay: .05, dash: '2 4'});
  sc.box({x: 0, y: 0, w: 270, d: 270, h: 46, c: 'blue', delay: .1, drop: 60, snap: false, order: -1000});
  sc.box({x: 22, y: 150, w: 44, d: 100, h: 118, z: 46, c: 'slate', stroke: false, delay: .3, drop: 50, order: 100});
  sc.box({x: 78, y: 150, w: 44, d: 100, h: 88, z: 46, c: 'slate', stroke: false, delay: .36, drop: 50, order: 100});
  sc.box({x: 134, y: 150, w: 44, d: 100, h: 58, z: 46, c: 'slate', stroke: false, delay: .42, drop: 50, order: 100});
  sc.box({x: 190, y: 26, w: 60, d: 60, h: 76, z: 46, c: 'orange', delay: .5, drop: 50, order: 70});
  // AlertZero has landed: docked inside its glass frame on the platform
  sc.box({x: 72, y: 34, w: 80, d: 80, h: 80, z: 46, c: 'pink', delay: .7, drop: 150, order: 50});
  sc.box({x: 60, y: 22, w: 104, d: 104, h: 104, z: 46, c: 'glass', wire: true, inner: true, stroke: '#343741', delay: .95, drop: 0, snap: false, order: 60});
  sc.label({at: [164, 22, 46 + 90], side: 'r', len: 50, title: 'AlertZero', sub: 'Docked and on watch', raw: true, delay: 1.2});
  sc.label({at: [22, 250, 46 + 100], side: 'l', len: 60, title: 'Four Watches', sub: ['Triage · Hunt', 'Detection · Forensics'], raw: true, delay: 1.1});
  sc.label({at: [250, 26, 46 + 38], side: 'r', len: 40, title: 'Elastic Security', sub: 'Detect · respond', raw: true, delay: 1.25});
  sc.label({at: [270, 60, 23], side: 'r', len: 36, title: 'Elasticsearch', sub: 'The platform', raw: true, delay: 1.35});
  const [cx, cy] = sc.P(112, 74, 46);
  const ring = EW.el('ellipse', {cx, cy, rx: 10, ry: 5.8, fill: 'none', stroke: '#F04E98', 'stroke-width': 1.2, opacity: 0}, sc.floor);
  sc.run();
  EW.loop(t => {
    if (t < 1.6) return;
    const k = ((t - 1.6) % 2.6) / 2.6;
    ring.setAttribute('rx', 60 + k * 120); ring.setAttribute('ry', (60 + k * 120) * .58); ring.setAttribute('opacity', (1 - k) * .6);
  });
})();
</script>
</body>
</html>
